services:
  - type: web
    name: railpulse-germany-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: false
      - key: DJANGO_ALLOWED_HOSTS
        value: railpulse-germany-api.onrender.com
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: https://railpulse-germany.vercel.app
      - key: FRONTEND_URL
        value: https://railpulse-germany.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: DB_API_KEY
        sync: false
      - key: DB_TIMETABLES_BASE_URL
        value: https://apis.deutschebahn.com/db-api-marketplace/apis/timetables/v1
      - key: DB_STADA_BASE_URL
        value: https://apis.deutschebahn.com/db-api-marketplace/apis/station-data/v2
      - key: HTTP_TIMEOUT_SECONDS
        value: 10
      - key: DEMO_USE_SAMPLE_DATA
        value: false
      - key: ALLOW_SAMPLE_FALLBACK
        value: true
